name: Validate self-service
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --target "$RUNNER_TEMP/self-service-python" --disable-pip-version-check -r requirements.txt
          echo "PYTHONPATH=$RUNNER_TEMP/self-service-python" >> "$GITHUB_ENV"
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      # No cluster, database, state or S3 administration credentials in Actions.
      # The dedicated reconciler on nxs plans/applies reviewed master.
