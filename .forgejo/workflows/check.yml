name: Validate self-service
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    # grm-раннер: с home реестр tofu провайдеров отдаёт 403 (Cloudflare-блок), из-за этого tofu init падает на холодном кэше
    runs-on: selfservice
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o validator.tar.gz https://git.cu3rd.ru/cu3rd/self-service-validator/releases/download/v1.0.0/validator-v1.0.0-linux-amd64.tar.gz
          tar -xzf validator.tar.gz
          install -m 755 validator-linux-amd64 /usr/local/bin/validator
      - run: validator validate .
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - run: helm lint charts/app
      # No cluster, database, state or S3 administration credentials in Actions.
      # The dedicated reconciler on nxs plans/applies reviewed master.
      - run: python3 ops/install-tofu.py
      - name: Validate OpenTofu without infrastructure credentials
        env:
          TF_VAR_state_passphrase: ci-validation-only-never-a-production-key
          TF_IN_AUTOMATION: '1'
          TF_INPUT: '0'
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -lockfile=readonly
          tofu validate
