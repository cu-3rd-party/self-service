name: Validate self-service
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: homelab-docker
    container: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python3 -m pip install --target "$RUNNER_TEMP/self-service-python" --disable-pip-version-check -r requirements.txt
          echo "PYTHONPATH=$RUNNER_TEMP/self-service-python" >> "$GITHUB_ENV"
      - run: python3 scripts/validate.py
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - run: helm lint charts/app
      - run: python3 -m unittest discover -s tests -v
      # No cluster, database, state or S3 administration credentials in Actions.
      # The dedicated reconciler on nxs plans/applies reviewed master.
      - run: python3 scripts/install-tofu.py
      - name: Validate OpenTofu without infrastructure credentials
        env:
          TF_VAR_state_passphrase: ci-validation-only-never-a-production-key
          TF_IN_AUTOMATION: '1'
          TF_INPUT: '0'
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -lockfile=readonly
          tofu validate
