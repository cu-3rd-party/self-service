name: Validate self-service
on:
  pull_request:
  push:
    branches: [master]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/self-service-venv"
          "$RUNNER_TEMP/self-service-venv/bin/pip" install --disable-pip-version-check -r requirements.txt
          echo "$RUNNER_TEMP/self-service-venv/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -v
      # No cluster, database, state or S3 administration credentials in Actions.
      # The dedicated reconciler on nxs plans/applies reviewed master.
