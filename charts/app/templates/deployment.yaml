apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: {{ .Values.strategy }}
  selector:
    matchLabels: {{- include "app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selector" . | nindent 8 }}
        {{- include "app.identity" . | nindent 8 }}
      annotations:
        self-service/config-revision: {{ .Values.configRevision | quote }}
        # перезапуск подов при смене секретов/переменных
        checksum/env: {{ toJson (concat (list .Values.env .Values.sealedEnv) (ternary (list .Values.configFiles) list (not (empty .Values.configFiles))) (ternary (list .Values.sealedFiles.keys) list (not (empty .Values.sealedFiles.keys)))) | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- $pull := .Values.imagePullSecrets }}
      {{- if .Values.sealedPullSecret }}
      {{- $pull = append $pull (printf "%s-pull" .Release.Name) }}
      {{- end }}
      {{- with $pull }}
      imagePullSecrets:
        {{- range . }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.env }}
          env:
            {{- range $k, $v := . }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if or .Values.sealedEnv .Values.secretRefs }}
          envFrom:
            {{- if .Values.sealedEnv }}
            - secretRef:
                name: {{ .Release.Name }}-env
            {{- end }}
            {{- range .Values.secretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- if or .Values.port .Values.metrics.enabled .Values.ssh.enabled }}
          ports:
            {{- if .Values.port }}
            - name: http
              containerPort: {{ .Values.port }}
            {{- range $name, $p := .Values.extraPorts }}
            - name: {{ $name }}
              containerPort: {{ $p }}
            {{- end }}
            {{- end }}
            {{- if and .Values.metrics.enabled (ne (int .Values.metrics.port) (int (.Values.port | default 0))) }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
            {{- if .Values.ssh.enabled }}
            - name: ssh
              containerPort: {{ .Values.ssh.port }}
            {{- end }}
          {{- if and .Values.port .Values.probes.path }}
          readinessProbe:
            httpGet: {path: {{ .Values.probes.path }}, port: http}
          # Медленный старт (тяжёлые импорты, воркер рядом) не должен убиваться liveness'ом -
          # startupProbe даёт до 3 минут на подъём, после его успеха liveness работает как раньше.
          startupProbe:
            httpGet: {path: {{ .Values.probes.path }}, port: http}
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: {path: {{ .Values.probes.path }}, port: http}
            initialDelaySeconds: 0
          {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.emptyDirs .Values.persistence .Values.configFiles .Values.ssh.enabled .Values.sealedFiles.keys .Values.hostPaths }}
          volumeMounts:
            {{- range $name, $path := .Values.emptyDirs }}
            - name: {{ $name }}
              mountPath: {{ $path }}
            {{- end }}
            {{- range $name, $v := .Values.hostPaths }}
            - name: {{ $name }}
              mountPath: {{ $v.mountPath }}
            {{- end }}
            {{- range $name, $v := .Values.persistence }}
            - name: {{ $name }}
              mountPath: {{ $v.path }}
            {{- end }}
            {{- range $name, $v := .Values.configFiles }}
            - name: files
              mountPath: {{ $v.path }}
              subPath: {{ $name }}
              readOnly: true
            {{- end }}
            {{- range $name, $v := .Values.sealedFiles.mounts }}
            - name: sfiles
              mountPath: {{ $v.path }}
              subPath: {{ $name }}
              readOnly: true
            {{- end }}
            {{- if .Values.ssh.enabled }}
            # каталогом, без subPath: смена ключа шлюза доходит без перезапуска пода
            - name: ssh
              mountPath: /run/self-service/ssh
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.emptyDirs .Values.persistence .Values.configFiles .Values.ssh.enabled .Values.sealedFiles.keys .Values.hostPaths }}
      volumes:
        {{- range $name, $_ := .Values.emptyDirs }}
        - name: {{ $name }}
          emptyDir: {}
        {{- end }}
        {{- range $name, $v := .Values.hostPaths }}
        - name: {{ $name }}
          hostPath: {path: {{ $v.path }}, type: Directory}
        {{- end }}
        {{- range $name, $_ := .Values.persistence }}
        - name: {{ $name }}
          persistentVolumeClaim:
            claimName: {{ $.Release.Name }}-{{ $name }}{{ $.Values.persistenceSuffix }}
        {{- end }}
        {{- if .Values.configFiles }}
        - name: files
          configMap:
            name: {{ .Release.Name }}-files
        {{- end }}
        {{- if .Values.sealedFiles.keys }}
        - name: sfiles
          secret:
            secretName: {{ .Release.Name }}-files
        {{- end }}
        {{- if .Values.ssh.enabled }}
        - name: ssh
          configMap:
            name: {{ .Release.Name }}-ssh
        {{- end }}
      {{- end }}
