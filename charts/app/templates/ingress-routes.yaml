{{- if .Values.routes }}
{{- $root := . }}
{{- $ports := dict }}
{{- $hosts := list }}
{{- range .Values.routes }}
{{- $_ := set $ports (printf "%v" .targetPort) .targetPort }}
{{- $hosts = append $hosts .domain }}
{{- end }}
{{- range $key := keys $ports | sortAlpha }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $root.Release.Name }}-p{{ $key }}
  labels: {{- include "app.labels" $root | nindent 4 }}
  {{- with $root.Values.serviceAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector: {{- include "app.selector" $root | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: {{ index $ports $key }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-routes
  labels: {{- include "app.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    {{- $mwNames := list (printf "%s-%s-routes-https@kubernetescrd" .Release.Namespace .Release.Name) }}
    {{- if .Values.grpcClientCertPassthrough }}
    {{- $mwNames = append $mwNames (printf "%s-%s-routes-client-cert@kubernetescrd" .Release.Namespace .Release.Name) }}
    {{- end }}
    {{- with .Values.extraMiddlewares }}
    {{- $mwNames = concat $mwNames . }}
    {{- end }}
    {{- if .Values.grpcClientCertPassthrough }}
    traefik.ingress.kubernetes.io/router.tls.options: {{ printf "%s-%s-routes-client-auth@kubernetescrd" .Release.Namespace .Release.Name | quote }}
    {{- end }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ join "," $mwNames | quote }}
spec:
  ingressClassName: traefik
  tls:
    - hosts: {{ toJson $hosts }}
      secretName: {{ .Release.Name }}-routes-tls
  rules:
    {{- range .Values.routes }}
    {{- $service := printf "%s-p%v" $root.Release.Name .targetPort }}
    - host: {{ .domain | quote }}
      http:
        paths:
          {{- range (.paths | default (list "/")) }}
          - path: {{ . | quote }}
            pathType: Prefix
            backend:
              service:
                name: {{ $service }}
                port:
                  number: 80
          {{- end }}
    {{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-routes-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
{{- if .Values.grpcClientCertPassthrough }}
---
# passTLSClientCert (pem: true) прокидывает клиентский TLS-серт в заголовок
# X-Forwarded-Tls-Client-Cert. Traefik выставляет заголовок из состояния
# TLS-соединения: значение, подделанное самим клиентом, перезаписывается
# (в CRD Traefik v3.7 опции perms нет, подмена отсекается перезаписью).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-routes-client-cert
spec:
  passTLSClientCert:
    pem: true
---
# Без clientAuth Traefik не запрашивает клиентский серт и passTLSClientCert
# передаёт пустой заголовок. RequestClientCert: серт запрашивается, но не
# обязателен (REST-клиенты без серта работают); проверку серта выполняет бэкенд.
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: {{ .Release.Name }}-routes-client-auth
spec:
  minVersion: VersionTLS12
  clientAuth:
    clientAuthType: RequestClientCert
{{- end }}
