{{- if .Values.publicPorts }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-public
  labels: {{- include "app.labels" . | nindent 4 }}
spec:
  type: NodePort
  # Traffic stays on the pod's node, so replies keep the address clients connected to.
  externalTrafficPolicy: Local
  selector: {{- include "app.selector" . | nindent 4 }}
  ports:
    {{- range .Values.publicPorts }}
    - name: {{ .name }}
      protocol: {{ .protocol }}
      port: {{ .port }}
      targetPort: {{ .name }}
      nodePort: {{ .port }}
    {{- end }}
{{- end }}
