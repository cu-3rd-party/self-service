{{- if .Values.sealedEnv }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-env
spec:
  encryptedData: {{- toYaml .Values.sealedEnv | nindent 4 }}
{{- end }}
{{- if .Values.sealedPullSecret }}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ .Release.Name }}-pull
spec:
  encryptedData:
    .dockerconfigjson: {{ .Values.sealedPullSecret }}
  template:
    type: kubernetes.io/dockerconfigjson
{{- end }}
