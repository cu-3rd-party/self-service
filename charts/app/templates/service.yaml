{{- if .Values.port }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "app.labels" . | nindent 4 }}
  {{- with .Values.serviceAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector: {{- include "app.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    {{- range $name, $p := .Values.extraPorts }}
    - name: {{ $name }}
      {{- if kindIs "map" $p }}
      port: {{ $p.port }}
      {{- else }}
      port: {{ $p }}
      {{- end }}
      targetPort: {{ $name }}
    {{- end }}
{{- end }}
