# Микросервис QR-кодов AirCul: cu3rd/aircul-qr (Rust, axum + SeaORM). Бот «Централь» и сайт ходят в него по JWT.
# Образ приватный (git.cu3rd.ru/cu3rd-private), pull-токен cu3rd-private-pull запечатан в sealedPullSecret под ns/имя релиза.
name: aircul-qr
team: sre
envs:
  prod:
    zone: grm
    quota: {cpu: 1, memory: 256Mi, storage: 128Mi}
    # SeaORM/sqlx кэширует подготовленные запросы на соединении — transaction-пулер PgBouncer не подходит
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
      pooler: false
    apps:
      api:
        repo: cu3rd/aircul-qr
        image: git.cu3rd.ru/cu3rd-private/aircul-qr
        tag: initial
        ingress:
          - domain: qr.cu3rd.ru
            targetPort: 8080
        secrets:
          JWT_SECRET: JWT_SECRET
        variables:
          # внешний адрес: из него строятся ссылки в QR ({base}/s/{code})
          PUBLIC_BASE_URL: PUBLIC_BASE_URL
        values:
          sealedPullSecret: 
          replicas: 1
          probes: {path: /health}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 500m, memory: 192Mi}
