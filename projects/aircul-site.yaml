# Сайт Посвята: cu3rd/aircul-site (.NET API + React/nginx). Один домен: /api, /scalar, /openapi — бэкенд, остальное — фронтенд.
# Образы приватные (git.cu3rd.ru/cu3rd-private), pull-токен cu3rd-private-pull (read:package) запечатан в sealedPullSecret под ns/имя релиза.
# Раньше жил в homelab (apps/aircul-site-*, namespace aircul-site, база aircul_site).
name: aircul-site
team: sre
envs:
  prod:
    zone: grm
    # запас под surge-под при RollingUpdate: 2 × (бэкенд 1 CPU/512Mi + фронтенд 200m/64Mi)
    quota: {cpu: 3, memory: 1536Mi, storage: 128Mi}
    # прежняя строка подключения тоже шла через пулер (No Reset On Close)
    postgres:
      enabled: true
      targetEnv: ConnectionStrings__AirCulDb
      format: npgsql
    apps:
      backend:
        repo: cu3rd/aircul-site
        image: git.cu3rd.ru/cu3rd-private/aircul-site-backend
        tag: initial
        ingress:
          - domain: root-day.cu3rd.ru
            targetPort: 8080
            paths: [/api, /scalar, /openapi]
        secrets:
          Auth__ServiceAdminLogin: SERVICE_ADMIN_LOGIN
          Auth__ServiceAdminPassword: SERVICE_ADMIN_PASSWORD
          # JWT сайта для aircul-qr (scope: codes:write codes:read); секция QrService бэкенда
          QrService__Token: AIRCUL_QR_TOKEN
        variables:
          QrService__BaseUrl: AIRCUL_QR_URL
          # бот «Централь» без @: QR за игру ведёт на https://t.me/<бот>?start=mg_<код>
          QrService__BotUsername: QR_BOT_USERNAME
        values:
          sealedPullSecret: 
          replicas: 1
          probes: {path: /health}
          resources:
            requests: {cpu: 200m, memory: 208Mi}
            limits: {cpu: 1, memory: 512Mi}
      frontend:
        repo: cu3rd/aircul-site
        image: git.cu3rd.ru/cu3rd-private/aircul-site-frontend
        tag: initial
        ingress:
          - domain: root-day.cu3rd.ru
            targetPort: 8080
        secrets:
          ADMIN_PATH: ADMIN_PATH
        variables:
          # nginx проверяет ссылки-токены игр запросом к бэкенду (сервис порта 80)
          BACKEND_URL: BACKEND_URL
        values:
          sealedPullSecret: 
          replicas: 1
          probes: {path: /healthz}
          resources:
            requests: {cpu: 50m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
