name: alpine-kvm
team: sre
envs:
  prod:
    # ВМ — только в зонах с аппаратной виртуализацией (сейчас nxs)
    zone: nxs
    # ВМ с 512Mi памяти занимает ~940Mi limits.memory (накладные расходы KubeVirt), диск +~6% на CDI
    quota: {cpu: 2, memory: 2Gi, storage: 5Gi}
    vms:
      # Настоящая ВМ (KubeVirt): Alpine, свой kernel, root через doas.
      # Вход: ssh -p 8222 alpine-kvm@ssh.cu3rd.ru, затем doas -s
      box:
        os: alpine-3.24
        cpu: 1
        memory: 512Mi
        disk: 4Gi
        ssh:
          login: alpine-kvm
          user: vm
          # дать доступ ещё кому-то — дописать сюда его публичный ключ
          authorizedKeys:
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPWyJCme/PgjTcYJadpxqt+q90FdzSN+3lAYUu9Q6999 igor@igor-Vivobook-Go-E1504FA-E1504FA
            - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDB5rHhig02oiDXAMeWv1m1Am5F2J+stEBSJi27M9me0 igor@fedora
