# cats-challenge: симулятор боёв (cu3rd-private/cats-challenge) — Rust gRPC-бэкенд
# (axum+tonic+SeaORM) + Godot wasm-зритель. Один домен: /cats_challenge (gRPC-пути),
# /api, /ws — бэкенд; остальное — wasm-зритель. Нативный gRPC требует h2c к бэкенду
# (serviceAnnotations) и более длинный префикс пути, чем / у зрителя.
# Образы приватные (cu3rd-private) — pull-токен запечатан в sealedPullSecret.
name: cats-challenge
team: sre
envs:
  dev:
    zone: nxs
    # endpoint-политики на раннере grm (скоринг 50061, demo-evo svc 50062)
    extraEgress:
      - {cidr: 109.120.137.209/32, ports: [50061, 50062]}
    # бэкенд с headless-воркером симуляции: лимит 3.5 CPU / 3.5Gi, запас на surge
    quota: {cpu: 4, memory: 4Gi, storage: 4Gi}
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    apps:
      backend:
        repo: cu3rd-private/cats-challenge
        image: git.cu3rd.ru/cu3rd-private/cats-challenge-backend
        tag: initial
        port: 8080
        ingress:
          - domain: cats-challenge.dev.cu3rd.ru
            targetPort: 8080
            paths: [/health, /cats_challenge, /cats_challenge., /api, /ws]
        variables:
          WORKER_ENABLED: WORKER_ENABLED
          DEMO_ENABLED: DEMO_ENABLED
        values:
          sealedPullSecret: 
          replicas: 1
          strategy: Recreate
          probes: {path: /health}
          serviceAnnotations:
            traefik.ingress.kubernetes.io/service.serversscheme: h2c
          persistence:
            replays: {path: /data/replays, size: 2Gi}
          resources:
            requests: {cpu: 500m, memory: 256Mi}
            limits: {cpu: 3500m, memory: 3500Mi}
      viewer:
        repo: cu3rd-private/cats-challenge
        image: git.cu3rd.ru/cu3rd-private/cats-challenge-viewer
        tag: initial
        port: 8080
        ingress:
          - domain: cats-challenge.dev.cu3rd.ru
            targetPort: 8080
        values:
          sealedPullSecret: 
          replicas: 1
          probes: {path: /}
          # nginx в образе зрителя ждёт запись в /var/cache/nginx и /var/run,
          # а поды крутятся как uid 10001 (restricted PSA) — даём tmpfs-тома.
          emptyDirs:
            nginx-cache: /var/cache/nginx
            nginx-run: /var/run
          resources:
            requests: {cpu: 20m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
