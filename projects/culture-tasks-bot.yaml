# Owning organization is culture (ex Jedi_kitten).
name: culture-tasks-bot
team: culture
envs:
  prod:
    zone: xgrm
    quota:
      cpu: 0.5
      memory: 512Mi
      storage: 1Gi
    apps:
      bot:
        repo: culture/culture-tasks-bot
        image: git.cu3rd.ru/culture/culture-tasks-bot
        tag: initial
        port: null
        secrets:
          BOT_TOKEN: BOT_TOKEN
        values:
          replicas: 1
          strategy: Recreate
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          persistence:
            data:
              path: /data
              size: 1Gi
        variables:
          ADMINS: ADMINS
          TIMEZONE: TIMEZONE
          DB_PATH: DB_PATH
