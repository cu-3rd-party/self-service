name: db-access
team: sre
envs:
  prod:
    # Порт Postgres 5432 для db.cu3rd.ru открыт только на grm (homelab postgres/public-cu-courses.yaml),
    # поэтому HTTP этого же домена тоже в зоне grm.
    zone: grm
    quota: {cpu: 1, memory: 256Mi, storage: 128Mi}
    # Свою базу сервис использует напрямую: lib/pq готовит запросы отдельным шагом,
    # а в режиме transaction PgBouncer может выполнить его уже на другом соединении.
    postgres:
      enabled: true
      targetEnv: DBACCESS_DB_DSN
      format: url
      pooler: false
    apps:
      web:
        repo: cu3rd/db-access
        image: git.cu3rd.ru/cu3rd/db-access
        tag: initial
        port: 8080
        ingress:
          - domain: db.cu3rd.ru
            targetPort: 8080
        secrets:
          # роль cu_provisioner: создаёт пользователей cu-sql и cu-db (homelab postgres/cluster-grm.yaml)
          DBACCESS_PG_PASSWORD: DBACCESS_PG_PASSWORD
          DBACCESS_COOKIE_SECRET: DBACCESS_COOKIE_SECRET
        values:
          # одна реплика: блокировка, связывающая роль и строку аккаунта, живёт в памяти процесса
          replicas: 1
          strategy: Recreate
          probes: {path: /api/healthz}
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
