name: fake-gigachat
team: members
envs:
  prod:
    zone: grm
    quota: {cpu: 1, memory: 256Mi, storage: 1Gi}
    # Ключ AI_API_KEY выдаёт ai-gateway. Лимиты защищают общий аккаунт OpenRouter:
    # чат открыт без авторизации.
    ai:
      enabled: true
      model: qwen/qwen3.7-flash
      models: [qwen/qwen3.7-flash]
      budgetUsd: 3
      budgetPeriod: 30d
      rpm: 60
    apps:
      web:
        repo: cu3rd/fake-gigachat
        image: git.cu3rd.ru/cu3rd/fake-gigachat
        tag: initial
        port: 8080
        ingress:
          - domain: gigachat.cu3rd.ru
            targetPort: 8080
        values:
          replicas: 1
          strategy: Recreate
          probes: {path: /api/health}
          resources:
            requests: {cpu: 5m, memory: 24Mi}
            limits: {cpu: 200m, memory: 64Mi}
