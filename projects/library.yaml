# Библиотека материалов cu3rd: cu3rd/3rd-library (Rust API + React SPA).
# Один домен на окружение: /api — бэкенд, остальное — фронтенд.
# dev (dev.lib.cu3rd.ru) — с каждого пуша в master, prod (lib.cu3rd.ru) — по тегу на master или ручному запуску CI.
name: library
team: sre
envs:
  dev:
    # S3 (storage.cu3rd.ru на xmsk) не отвечает по TCP с nxs с 2026-11-07, а бэкенд на старте ждёт
    # проверки бакета дольше, чем терпит liveness; с xgrm S3 доступен.
    zone: xgrm
    # запас под surge при RollingUpdate: на время выката живут две реплики бэкенда
    quota: {cpu: 3, memory: 1536Mi, storage: 512Mi}
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    s3:
      enabled: true
      targetEnvPrefix: S3_
      quotaBytes: 2147483648
    apps:
      backend:
        repo: cu3rd/3rd-library
        image: git.cu3rd.ru/cu3rd/3rd-library-backend
        tag: initial
        ingress:
          - domain: dev.lib.cu3rd.ru
            targetPort: 8080
            paths: [/api]
        metrics:
          enabled: true
          port: 9091
        secrets:
          HMAC_KEY: DEV_HMAC_KEY
          SMTP_PASSWORD: SMTP_PASSWORD
        variables:
          SMTP_HOST: SMTP_HOST
          SMTP_USER: SMTP_USER
        values:
          # ограничение частоты запросов считается в памяти реплики
          replicas: 1
          probes: {path: /api/health}
          resources:
            # загружаемые файлы читаются в память целиком
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 1, memory: 512Mi}
      frontend:
        repo: cu3rd/3rd-library
        image: git.cu3rd.ru/cu3rd/3rd-library-frontend
        tag: initial
        ingress:
          - domain: dev.lib.cu3rd.ru
            targetPort: 8080
        values:
          replicas: 1
          probes: {path: /}
          resources:
            requests: {cpu: 2m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
  prod:
    zone: xgrm
    quota: {cpu: 3, memory: 3Gi, storage: 512Mi}
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    s3:
      enabled: true
      targetEnvPrefix: S3_
      quotaBytes: 10737418240
    apps:
      backend:
        repo: cu3rd/3rd-library
        image: git.cu3rd.ru/cu3rd/3rd-library-backend
        tag: initial
        ingress:
          - domain: lib.cu3rd.ru
            targetPort: 8080
            paths: [/api]
        metrics:
          enabled: true
          port: 9091
        secrets:
          HMAC_KEY: PROD_HMAC_KEY
          SMTP_PASSWORD: SMTP_PASSWORD
        variables:
          SMTP_HOST: SMTP_HOST
          SMTP_USER: SMTP_USER
        values:
          replicas: 1
          probes: {path: /api/health}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 1, memory: 1Gi}
      frontend:
        repo: cu3rd/3rd-library
        image: git.cu3rd.ru/cu3rd/3rd-library-frontend
        tag: initial
        ingress:
          - domain: lib.cu3rd.ru
            targetPort: 8080
        values:
          replicas: 1
          probes: {path: /}
          resources:
            requests: {cpu: 2m, memory: 16Mi}
            limits: {cpu: 200m, memory: 64Mi}
