# Owning organization is culture (ex Jedi_kitten).
name: open-pairs-bot
team: culture
envs:
  prod:
    zone: xgrm
    quota:
      cpu: 0.5
      memory: 512Mi
      storage: 1Gi
    apps:
      bot:
        repo: culture/open-pairs-bot
        image: git.cu3rd.ru/culture/open-pairs-bot
        tag: initial
        port: null
        secrets:
          BOT_TOKEN: BOT_TOKEN
        values:
          replicas: 1
          strategy: Recreate
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          persistence:
            data:
              path: /data
              size: 1Gi
        variables:
          REMIND_DAY_BEFORE: REMIND_DAY_BEFORE
          REMIND_BEFORE_MIN: REMIND_BEFORE_MIN
          ADMINS: ADMINS
          TIMEZONE: TIMEZONE
          EVENT_START: EVENT_START
          EVENT_END: EVENT_END
          WAITLIST_SIZE: WAITLIST_SIZE
          DB_PATH: DB_PATH
          INBOX_DIR: INBOX_DIR
