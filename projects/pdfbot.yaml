name: pdfbot
team: sre
envs:
  prod:
    zone: nxs
    # сверх лимитов бота (200m/256Mi) место под под cert-manager ACME-solver (100m/64Mi),
    # иначе квота не пускает его и сертификат не выпускается и не продлевается
    quota: {cpu: 0.3, memory: 320Mi, storage: 64Mi}
    # очередь страниц через transaction-пулер PgBouncer; бот ходит simple protocol без prepared statements
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    apps:
      bot:
        repo: cu3rd/pdfbot
        image: git.cu3rd.ru/cu3rd/pdfbot
        tag: initial
        port: 8080
        ingress:
          - domain: pdfbot.cu3rd.ru
            targetPort: 8080
        secrets:
          TELEGRAM_BOT_TOKEN: TELEGRAM_BOT_TOKEN
        variables:
          WEBHOOK_URL: WEBHOOK_URL
        values:
          # при старте бот возвращает в очередь брошенные сборки, две копии сразу нельзя; и квота на одну
          replicas: 1
          strategy: Recreate
          probes: {path: /healthz}
          resources:
            # pdf стримится из телеграма в телеграм: 100 сборок разом около 30 МБ кучи, GOMEMLIMIT 200MiB
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 200m, memory: 256Mi}
