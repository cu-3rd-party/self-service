name: rss2tg
team: members
envs:
  dev:
    zone: nxs
    quota: {cpu: 1, memory: 128Mi, storage: 128Mi}
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    apps:
      bot:
        repo: cu3rd/rss2tg
        image: git.cu3rd.ru/cu3rd/rss2tg
        tag: initial
        metrics:
          enabled: true
          port: 8080
          path: /metrics
        variables:
          APP_NAME: APP_NAME
        values:
          replicas: 1
          strategy: Recreate
          probes: {path: /api/health}
          resources:
            requests: {cpu: 2m, memory: 30Mi}
            limits: {cpu: 2m, memory: 30Mi}
