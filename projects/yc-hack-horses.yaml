name: yc-hack-horses
team: sre
envs:
  prod:
    zone: grm
    quota: {cpu: 2, memory: 2Gi, storage: 10Gi}
    # Central нода: postgres платформенный ресурс, DATABASE_URL приходит из него
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    apps:
      web:
        repo: cu3rd/yc-hack-horses
                # Публичный пакет — runner и чарт тянут без pull-секрета.
        image: git.cu3rd.ru/cu3rd/yc-hack-horses
        tag: initial
        port: 8080
        ingress:
          - domain: yc-hack-horses.cu3rd.ru
            targetPort: 8080
        values:
          replicas: 1
          # gRPC центральной ноды за ingress: бэкенду Traefik говорит h2c (HTTP/2
          # cleartext) — REST и gRPC мультиплексируются в приложении (GRPC_MULTIPLEX).
          serviceAnnotations:
            traefik.ingress.kubernetes.io/service.serversscheme: h2c
          # Прокидывание клиентского TLS-серта бэкенду (mTLS через ingress):
          # Middleware passTLSClientCert (pem: true) + TLSOption clientAuth
          # RequestClientCert. Traefik выставляет X-Forwarded-Tls-Client-Cert из
          # TLS-соединения, значение от клиента перезаписывается (подделка
          # заголовка identity не подделывает); perms в Traefik CRD v3.7 нет.
          grpcClientCertPassthrough: true
          probes: {path: /health}
          # serviceAnnotations h2c НЕ ставим: gRPC сейчас на loopback, Go net/http
          # без h2c-обработчика отвечает 500 на HTTP/2 от Traefik; включить, когда
          # бэкенд научится h2c (нативный gRPC за ingress).
          # Поды чарта работают под UID 10001 — blob store пишет в writable /tmp (emptyDir)
          emptyDirs:
            tmp: /tmp
          resources:
            # квота зоны grm: cpu 2, memory 2Gi — оставляем запас
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: "1", memory: 1Gi}
          # mTLS-сертификаты (dev CA, development-only): SealedSecret <release>-files,
          # ключи node.crt/node.key/ca.crt монтируются в /run/secrets (ADR-0007/0008)
          sealedFiles:
            keys:
              node.crt: 
              node.key: 
              ca.crt: 
              ca.key: 
            mounts:
              node.crt: {path: /run/secrets/node.crt}
              node.key: {path: /run/secrets/node.key}
              ca.crt: {path: /run/secrets/ca.crt}
              ca.key: {path: /run/secrets/ca.key}
          # mTLS-сертификаты монтируются чартом из sealedFiles выше
        variables:
          LOG_LEVEL: LOG_LEVEL
          LISTEN_ADDR: LISTEN_ADDR
          DATA_DIR: DATA_DIR
          # gRPC mTLS внутри пода (0.0.0.0:9443, наружу не открывается); серт+CA из /run/secrets
          GRPC_LISTEN_ADDR: GRPC_LISTEN_ADDR
          # h2c-мультиплекс REST+gRPC на listen_addr; аутентификация gRPC —
          # по серту из X-Forwarded-Tls-Client-Cert против CA_FILE
          GRPC_MULTIPLEX: GRPC_MULTIPLEX
          # центральная нода ходит в платформенный Postgres
          STORAGE_DRIVER: STORAGE_DRIVER
          NODE_CERT_FILE: NODE_CERT_FILE
          NODE_KEY_FILE: NODE_KEY_FILE
          CERT_FILE: CERT_FILE
          KEY_FILE: KEY_FILE
          CA_FILE: CA_FILE
          # Scalar UI (/api/scalar) — только у центральной ноды
          API_DOCS_ENABLED: API_DOCS_ENABLED
          # Enrollment leaf-сертификатов (365 дней): токен + CA-ключ для подписи
          ENROLLMENT_ENABLED: ENROLLMENT_ENABLED
          ENROLLMENT_TOKEN: ENROLLMENT_TOKEN
          ENROLLMENT_CA_KEY_FILE: ENROLLMENT_CA_KEY_FILE
