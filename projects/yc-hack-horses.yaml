name: yc-hack-horses
team: sre
envs:
  prod:
    zone: grm
    quota: {cpu: 2, memory: 2Gi, storage: 10Gi}
    # Central нода: postgres платформенный ресурс, DATABASE_URL приходит из него
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    apps:
      web:
        repo: cu3rd/yc-hack-horses
        # Репо приватное — образ в cu3rd-private, pull-токен запечатан под ns/имя релиза
        image: git.cu3rd.ru/cu3rd-private/yc-hack-horses
        tag: initial
        port: 8080
        ingress:
          - domain: yc-hack-horses.cu3rd.ru
            targetPort: 8080
        values:
          sealedPullSecret: 
          replicas: 1
          probes: {path: /health}
          serviceAnnotations:
            # Нативный gRPC (HTTP/2) за Traefik без h2c к бэкенду падает
            traefik.ingress.kubernetes.io/service.serversscheme: h2c
          resources:
            # квота зоны grm: cpu 2, memory 2Gi — оставляем запас
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: "1", memory: 1Gi}
        variables:
          LOG_LEVEL: LOG_LEVEL
          LISTEN_ADDR: LISTEN_ADDR
          NODE_CERT_FILE: NODE_CERT_FILE
          NODE_KEY_FILE: NODE_KEY_FILE
          CA_FILE: CA_FILE
