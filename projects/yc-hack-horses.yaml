name: yc-hack-horses
team: sre
envs:
  prod:
    zone: grm
    quota: {cpu: 2, memory: 2Gi, storage: 10Gi}
    # Central нода: postgres платформенный ресурс, DATABASE_URL приходит из него
    postgres:
      enabled: true
      targetEnv: DATABASE_URL
      format: url
    apps:
      web:
        repo: cu3rd/yc-hack-horses
                # Публичный пакет — runner и чарт тянут без pull-секрета.
        image: git.cu3rd.ru/cu3rd/yc-hack-horses
        tag: initial
        port: 8080
        ingress:
          - domain: yc-hack-horses.cu3rd.ru
            targetPort: 8080
        values:
          replicas: 1
          probes: {path: /health}
          # serviceAnnotations h2c НЕ ставим: gRPC сейчас на loopback, Go net/http
          # без h2c-обработчика отвечает 500 на HTTP/2 от Traefik; включить, когда
          # бэкенд научится h2c (нативный gRPC за ingress).
          # Поды чарта работают под UID 10001 — blob store пишет в writable /tmp (emptyDir)
          emptyDirs:
            tmp: /tmp
          resources:
            # квота зоны grm: cpu 2, memory 2Gi — оставляем запас
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: "1", memory: 1Gi}
        variables:
          LOG_LEVEL: LOG_LEVEL
          LISTEN_ADDR: LISTEN_ADDR
          DATA_DIR: DATA_DIR
          # без mTLS-сертификатов gRPC допускается только на loopback (ADR-0007/0008)
          GRPC_LISTEN_ADDR: GRPC_LISTEN_ADDR
          # центральная нода ходит в платформенный Postgres
          STORAGE_DRIVER: STORAGE_DRIVER
          NODE_CERT_FILE: NODE_CERT_FILE
          NODE_KEY_FILE: NODE_KEY_FILE
          CA_FILE: CA_FILE
          # Scalar UI (/api/scalar) — только у центральной ноды
          API_DOCS_ENABLED: API_DOCS_ENABLED
