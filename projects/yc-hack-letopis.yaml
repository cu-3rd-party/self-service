# Мульти-контейнерный стек letopis: web (SvelteKit SSR), api (Go), lightrag, ocr, db (postgres 16 + Apache AGE/pgvector).
# Nginx-роутер из compose не переносится: /api и / разделяет ingress одного домена.
# Образы приватные (git.cu3rd.ru/cu3rd-private), pull-токен cu3rd-private-pull запечатан в sealedPullSecret под ns/имя релиза.
name: yc-hack-letopis
team: sre
envs:
  prod:
    zone: xgrm
    quota: {cpu: 2, memory: 4Gi, storage: 20Gi}
    apps:
      web:
        repo: cu3rd/yc-hack-letopis
        image: git.cu3rd.ru/cu3rd-private/yc-hack-letopis-web
        tag: initial
        port: 5173
        ingress:
          - domain: yc-hack-letopis.cu3rd.ru
            targetPort: 5173
            paths: [/]
        values:
          replicas: 1
          probes: {path: /}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}
          sealedPullSecret: 
      api:
        repo: cu3rd/yc-hack-letopis
        image: git.cu3rd.ru/cu3rd-private/yc-hack-letopis-api
        tag: initial
        port: 8080
        ingress:
          - domain: yc-hack-letopis.cu3rd.ru
            targetPort: 8080
            paths: [/api]
        secrets:
          POSTGRES_PASSWORD: POSTGRES_PASSWORD
          AUTH_SECRET: AUTH_SECRET
        variables:
          POSTGRES_HOST: POSTGRES_HOST
          POSTGRES_PORT: POSTGRES_PORT
          POSTGRES_USER: POSTGRES_USER
          POSTGRES_DB: POSTGRES_DB
          LIGHTRAG_SERVICE_URL: LIGHTRAG_SERVICE_URL
          OCR_SERVICE_URL: OCR_SERVICE_URL
        values:
          replicas: 1
          probes: {path: /api/health}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          sealedPullSecret: 
      lightrag:
        repo: cu3rd/yc-hack-letopis
        image: git.cu3rd.ru/cu3rd-private/yc-hack-letopis-lightrag
        tag: initial
        port: 9621
        secrets:
          POSTGRES_PASSWORD: POSTGRES_PASSWORD
        variables:
          POSTGRES_HOST: POSTGRES_HOST
          POSTGRES_PORT: POSTGRES_PORT
          POSTGRES_USER: POSTGRES_USER
          POSTGRES_DATABASE: POSTGRES_DB
          LIGHTRAG_LLM_BINDING: LIGHTRAG_LLM_BINDING
          LIGHTRAG_LLM_BINDING_HOST: LIGHTRAG_LLM_BINDING_HOST
          LIGHTRAG_LLM_TIMEOUT: LIGHTRAG_LLM_TIMEOUT
          LIGHTRAG_EMBEDDING_BINDING: LIGHTRAG_EMBEDDING_BINDING
          LIGHTRAG_EMBEDDING_BINDING_HOST: LIGHTRAG_EMBEDDING_BINDING_HOST
          LIGHTRAG_EMBEDDING_DIM: LIGHTRAG_EMBEDDING_DIM
          LIGHTRAG_EMBEDDING_TOKEN_LIMIT: LIGHTRAG_EMBEDDING_TOKEN_LIMIT
          LIGHTRAG_EMBEDDING_SEND_DIM: LIGHTRAG_EMBEDDING_SEND_DIM
          LIGHTRAG_EMBEDDING_USE_BASE64: LIGHTRAG_EMBEDDING_USE_BASE64
          LIGHTRAG_SUMMARY_LANGUAGE: LIGHTRAG_SUMMARY_LANGUAGE
          LIGHTRAG_MAX_ASYNC_LLM: LIGHTRAG_MAX_ASYNC_LLM
          LIGHTRAG_MAX_PARALLEL_INSERT: LIGHTRAG_MAX_PARALLEL_INSERT
          LIGHTRAG_EMBEDDING_FUNC_MAX_ASYNC: LIGHTRAG_EMBEDDING_FUNC_MAX_ASYNC
          LIGHTRAG_EMBEDDING_BATCH_NUM: LIGHTRAG_EMBEDDING_BATCH_NUM
          LIGHTRAG_KV_STORAGE: LIGHTRAG_KV_STORAGE
          LIGHTRAG_DOC_STATUS_STORAGE: LIGHTRAG_DOC_STATUS_STORAGE
          LIGHTRAG_GRAPH_STORAGE: LIGHTRAG_GRAPH_STORAGE
          LIGHTRAG_VECTOR_STORAGE: LIGHTRAG_VECTOR_STORAGE
          POSTGRES_VECTOR_INDEX_TYPE: POSTGRES_VECTOR_INDEX_TYPE
          POSTGRES_HNSW_M: POSTGRES_HNSW_M
          POSTGRES_HNSW_EF: POSTGRES_HNSW_EF
          POSTGRES_IVFFLAT_LISTS: POSTGRES_IVFFLAT_LISTS
          LIGHTRAG_WORKSPACE: LIGHTRAG_WORKSPACE
        values:
          replicas: 1
          strategy: Recreate
          probes: {path: /health}
          persistence:
            data: {path: /app/data, size: 1Gi}
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          sealedPullSecret: 
      ocr:
        repo: cu3rd/yc-hack-letopis
        image: git.cu3rd.ru/cu3rd-private/yc-hack-letopis-ocr
        tag: initial
        port: 8000
        variables:
          OCR_TEMP_DIR: OCR_TEMP_DIR
          OCR_API_PREFIX: OCR_API_PREFIX
          OCR_PROVIDER: OCR_PROVIDER
          OCR_LOG_LEVEL: OCR_LOG_LEVEL
        values:
          replicas: 1
          emptyDirs:
            tmp: /app/tmp
          resources:
            requests: {cpu: 10m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          sealedPullSecret: 
      pgdb:
        repo: cu3rd/yc-hack-letopis
        image: git.cu3rd.ru/cu3rd-private/yc-hack-letopis-db
        tag: initial
        # фиктивный порт для валидатора (>=1024); реальный postgres слушает 5432 через extraPorts
        port: 15432
        secrets:
          POSTGRES_PASSWORD: POSTGRES_PASSWORD
        values:
          replicas: 1
          strategy: Recreate
          extraPorts:
            pg: 5432
          persistence:
            data: {path: /var/lib/postgresql/data, size: 10Gi}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          sealedPullSecret: 
